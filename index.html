<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping Sisu — Finnish Resilience Stories</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div id="map"></div>

    <div id="sidebar">
        <div id="sidebar-header">
            <h1>Mapping Sisu</h1>
            <p>Stories of Finnish resilience — from the Winter War to modern innovation.</p>
        </div>

        <div id="filters">
            <!-- Filter buttons injected by JS -->
        </div>

        <div id="story-content">
            <div class="empty-state">
                <p>Select a marker on the map to explore stories of Finnish resilience.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
